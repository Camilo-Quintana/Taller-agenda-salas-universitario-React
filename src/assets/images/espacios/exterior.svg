  </defs>
  <!-- cielo y sol -->
  <rect width="600" height="400" fill="url(#cielo)"/>
  <circle cx="488" cy="88" r="62" fill="#d4a72c" opacity="0.18"/>
  <circle cx="488" cy="88" r="40" fill="#d4a72c"/>
  <!-- mar de Viña del Mar -->
  <rect y="214" width="600" height="40" fill="#8fbcd4"/>
  <path d="M0 230 q25 -7 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <!-- edificio del campus -->
  <rect x="44" y="104" width="196" height="150" fill="#7a1128"/>
  <rect x="34" y="92" width="216" height="16" fill="#4d0a19"/>
  <g fill="#f4e6c1">
    <rect x="66" y="126" width="34" height="28"/>
