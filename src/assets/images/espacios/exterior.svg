    <line x1="0" y1="352" x2="600" y2="352"/>
    <line x1="150" y1="254" x2="110" y2="400"/>
    <line x1="300" y1="254" x2="300" y2="400"/>
    <line x1="450" y1="254" x2="490" y2="400"/>
