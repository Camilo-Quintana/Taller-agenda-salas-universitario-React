  <!-- árbol -->
  <rect x="452" y="196" width="14" height="80" fill="#6b4e2e"/>
  <circle cx="459" cy="186" r="42" fill="#4f7a45"/>
  <circle cx="428" cy="208" r="27" fill="#5b8a50"/>
  <circle cx="490" cy="210" r="27" fill="#5b8a50"/>
