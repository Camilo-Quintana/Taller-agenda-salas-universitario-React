<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis reservas - ReservaUNAB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/filtros.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/salas.js"></script>
    <script src="./js/reservas.js" defer></script>
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="navbar-brand">
                <img src="./img/logo.png" alt="ReservaUNAB" class="logo">
            </a> 
            <div class="nav-right">
                <a href="index.html" class="nav-link">
                    <img src="./img/espacios.png" alt="" class="icon">
                    Espacios
                </a>
                <a href="reservas.html" class="nav-link active">
                    <img src="./img/reservas.png" alt="" class="icon">
                    Mis reservas
                </a>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <section>
            <h1>Mis reservas</h1>
            
            <div id="lista-reservas" class="row g-3" role="region" aria-label="Lista de reservas">
                <!-- Las reservas se cargan aquí dinámicamente -->
            </div>
            
            <p id="sin-reservas" class="text-center text-muted py-5">
                Aún no tienes reservas. <a href="index.html">Ir a reservar un espacio</a>
            </p>
        </section>
    </main>

    <!-- Modal confirmación de cancelación -->
    <div class="modal fade" id="ventana-cancelar" tabindex="-1" aria-labelledby="titulo-cancelar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="titulo-cancelar">Cancelar reserva</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar modal"></button>
                </div>
                <div class="modal-body">
                    <p id="msg-cancelar">¿Estás seguro que quieres cancelar esta reserva?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">No, mantener</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-cancelar">Sí, cancelar reserva</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Avisos flotantes -->
    <div id="contenedor-avisos" class="position-fixed bottom-0 end-0 p-3" role="region" aria-live="polite" aria-atomic="true"></div>

    <footer>
        <p>© 2026 Universidad Andres Bello - ReservaUNAB v2.0</p>
    </footer>
</body>
</html>
