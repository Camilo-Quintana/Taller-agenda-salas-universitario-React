<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReservaUNAB - Reserva de espacios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/filtros.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/salas.js"></script>
    <script src="./js/index.js" defer></script>
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="navbar-brand">
                <img src="./img/logo.png" alt="ReservaUNAB" class="logo">
            </a> 
            <div class="nav-right">
                <a href="#perfil" class="nav-link">
                    <img src="./img/user.png" alt="" class="icon">
                    Mi perfil
                </a> 
                <a href="reservas.html" class="nav-link">
                    <img src="./img/reservas.png" alt="" class="icon">
                    Mis reservas
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="filtros-section">
            <h1>Espacios disponibles</h1>
            
            <form id="barra-filtros" class="filtros">
                <div class="filtro-grupo">
                    <label for="filtro-busqueda">Buscar</label>
                    <input type="search" id="filtro-busqueda" class="form-control" placeholder="Buscar espacio…" aria-label="Buscar espacio por nombre">
                </div>
                
                <div class="filtro-grupo">
                    <label for="filtro-tipo">Tipo</label>
                    <select id="filtro-tipo" class="form-select" aria-label="Filtrar por tipo de espacio">
                        <option value="">Tipo</option>
                    </select>
                </div>

                <div class="filtro-grupo">
                    <label for="filtro-edificio">Edificio</label>
                    <select id="filtro-edificio" class="form-select" aria-label="Filtrar por edificio">
                        <option value="">Edificio</option>
                    </select>
                </div>
                
                <div class="filtro-grupo">
                    <label for="filtro-capacidad">Capacidad</label>
                    <select id="filtro-capacidad" class="form-select" aria-label="Filtrar por capacidad mínima">
                        <option value="">Capacidad</option>
                        <option value="5">5+ personas</option>
                        <option value="15">15+ personas</option>
                        <option value="30">30+ personas</option>
                    </select>
                </div>
                
                <div class="filtro-grupo">
                    <label for="filtro-fecha">Fecha</label>
                    <input type="date" id="filtro-fecha" class="form-control" aria-label="Seleccionar fecha para ver disponibilidad">
                </div>
            </form>
        </section>

        <section id="salas-container" class="content row g-3">
            <!-- Las salas se cargan aquí dinámicamente -->
        </section>
    </main>

    <!-- Modal de reserva -->
    <div class="modal fade" id="ventana-reserva" tabindex="-1" aria-labelledby="ventana-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="ventana-titulo">Reservar</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar modal"></button>
                </div>
                <form id="form-reserva">
                    <div class="modal-body">
                        <input type="hidden" id="reserva-espacio-id">
                        
                        <div class="mb-3">
                            <label for="reserva-fecha" class="form-label">Fecha <span class="text-danger">*</span></label>
                            <input type="date" id="reserva-fecha" class="form-control" required aria-required="true">
                            <div class="invalid-feedback" id="err-fecha"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Horarios disponibles <span class="text-danger">*</span></label>
                            <div id="grilla-bloques" class="d-flex flex-wrap gap-2" role="group" aria-label="Seleccionar horario"></div>
                            <div class="text-danger small d-none" id="err-bloque" role="alert"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="reserva-nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                            <input type="text" id="reserva-nombre" class="form-control" required aria-required="true" placeholder="Tu nombre completo">
                            <div class="invalid-feedback" id="err-nombre"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="reserva-correo" class="form-label">Correo <span class="text-danger">*</span></label>
                            <input type="email" id="reserva-correo" class="form-control" required aria-required="true" placeholder="tu.email@unab.cl">
                            <div class="invalid-feedback" id="err-correo"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="reserva-rut" class="form-label">RUT <span class="text-danger">*</span></label>
                            <input type="text" id="reserva-rut" class="form-control" placeholder="12.345.678-5" required aria-required="true">
                            <div class="invalid-feedback" id="err-rut"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Confirmar reserva</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Avisos flotantes -->
    <div id="contenedor-avisos" class="position-fixed bottom-0 end-0 p-3" role="region" aria-live="polite" aria-atomic="true"></div>

    <footer>
        <p>© 2026 Universidad Andres Bello - ReservaUNAB v2.0</p>  
    </footer>
</body>
</html>
