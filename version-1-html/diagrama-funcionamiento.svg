<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .h{ font-size:15px; font-weight:800; fill:#ffffff; }
      .b{ font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; fill:#0f172a; }
      .n{ font-size:11.5px; fill:#334155; }
      .lbl{ font-size:11px; fill:#64748b; font-style:italic; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>

  <!-- Encabezado -->
  <rect x="0" y="0" width="1200" height="72" fill="#7a1128"/>
  <text x="30" y="34" fill="#ffffff" font-size="23" font-weight="800">Cómo funciona ReservaUNAB</text>
  <text x="30" y="58" fill="#f4e6c1" font-size="14">Dos páginas · un archivo compartido (salas.js) · datos guardados en localStorage</text>

  <!-- ===== Nivel 1: páginas HTML ===== -->
  <g>
    <rect x="120" y="92" width="400" height="60" rx="10" fill="#fdecef" stroke="#7a1128" stroke-width="1.5"/>
    <text x="320" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#7a1128">index.html</text>
    <text x="320" y="138" text-anchor="middle" class="n">Explorar espacios y reservar</text>

    <rect x="690" y="92" width="400" height="60" rx="10" fill="#fdecef" stroke="#7a1128" stroke-width="1.5"/>
    <text x="890" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#7a1128">reservas.html</text>
    <text x="890" y="138" text-anchor="middle" class="n">Ver y cancelar mis reservas</text>
  </g>

  <!-- flechas página -> js -->
  <line x1="320" y1="152" x2="320" y2="192" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="178" class="lbl">carga</text>
  <line x1="890" y1="152" x2="890" y2="192" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="178" class="lbl">carga</text>

  <!-- ===== Nivel 2: JS de cada página ===== -->
  <g>
    <rect x="100" y="194" width="440" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="100" y="194" width="440" height="30" rx="10" fill="#2563eb"/>
    <rect x="100" y="212" width="440" height="12" fill="#2563eb"/>
    <text x="116" y="215" class="h">js/index.js — página principal</text>
    <text class="b" x="116" y="248">llenarSelects()</text><text class="n" x="300" y="248">llena los filtros</text>
    <text class="b" x="116" y="270">aplicarFiltros()</text><text class="n" x="300" y="270">filtra las salas</text>
    <text class="b" x="116" y="292">mostrarPagina()</text><text class="n" x="300" y="292">tarjetas (6 por página)</text>
    <text class="b" x="116" y="314">abrirModalReserva()</text><text class="n" x="320" y="314">horarios libres/ocupados</text>
    <text class="b" x="116" y="336">configurarFormularioReserva()</text>
    <text class="n" x="116" y="354">valida (RUT, correo, fecha, 1×día, horario) y guarda</text>
  </g>

  <g>
    <rect x="680" y="194" width="420" height="130" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="680" y="194" width="420" height="30" rx="10" fill="#1e8e5a"/>
    <rect x="680" y="212" width="420" height="12" fill="#1e8e5a"/>
    <text x="696" y="215" class="h">js/reservas.js — mis reservas</text>
    <text class="b" x="696" y="250">mostrarReservas()</text><text class="n" x="880" y="250">lista ordenada</text>
    <text class="b" x="696" y="274">configurarCancelacion()</text>
    <text class="n" x="696" y="294">cancelar con ventana de confirmación</text>
  </g>

  <!-- flechas js -> salas.js -->
  <line x1="320" y1="370" x2="470" y2="452" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="410" class="lbl">usa</text>
  <line x1="890" y1="324" x2="740" y2="452" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="392" class="lbl">usa</text>

  <!-- ===== Nivel 3: salas.js compartido ===== -->
  <g>
    <rect x="230" y="452" width="740" height="150" rx="12" fill="#fffaf0" stroke="#d4a72c" stroke-width="2"/>
    <rect x="230" y="452" width="740" height="30" rx="12" fill="#d4a72c"/>
    <rect x="230" y="470" width="740" height="12" fill="#d4a72c"/>
    <text x="246" y="473" font-size="15" font-weight="800" fill="#4d0a19">js/salas.js — COMPARTIDO por las dos páginas</text>

    <text x="256" y="508" font-size="12" font-weight="800" fill="#7a1128">DATOS</text>
    <text class="b" x="256" y="528">salas (19)</text>
    <text class="b" x="256" y="548">BLOQUES (13 horarios)</text>
    <text class="n" x="256" y="574">imágenes por tipo</text>

    <text x="500" y="508" font-size="12" font-weight="800" fill="#7a1128">VALIDACIONES</text>
    <text class="b" x="500" y="528">validarRut()  (módulo 11)</text>
    <text class="b" x="500" y="548">validarEmail()</text>
    <text class="b" x="500" y="568">bloqueEstaTomado()</text>
    <text class="b" x="500" y="588">estudianteYaReservoEseDia()</text>

    <text x="770" y="508" font-size="12" font-weight="800" fill="#7a1128">UTILIDADES</text>
    <text class="b" x="770" y="528">fechaHoy / fechaManana</text>
    <text class="b" x="770" y="548">cargar / guardarReservas</text>
    <text class="b" x="770" y="568">mostrarAviso()</text>
    <text class="b" x="770" y="588">buscar()</text>
  </g>

  <!-- flecha salas.js -> localStorage (doble sentido) -->
  <line x1="600" y1="602" x2="600" y2="648" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="610" y="628" class="lbl">guardar / leer</text>

  <!-- ===== Nivel 4: localStorage ===== -->
  <g>
    <ellipse cx="600" cy="652" rx="150" ry="14" fill="#4d0a19"/>
    <rect x="450" y="652" width="300" height="56" fill="#4d0a19"/>
    <ellipse cx="600" cy="708" rx="150" ry="14" fill="#4d0a19"/>
    <text x="600" y="672" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">localStorage</text>
    <text x="600" y="692" text-anchor="middle" fill="#f4e6c1" font-size="11">clave "reservas_unab" (JSON)</text>
  </g>

  <!-- ===== Flujo de una reserva ===== -->
  <text x="30" y="760" font-size="15" font-weight="800" fill="#0f172a">Flujo de una reserva</text>
  <g font-size="11">
    <rect x="30"  y="775" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="100" y="794" text-anchor="middle" class="b" font-size="11">Usuario: clic</text>
    <text x="100" y="809" text-anchor="middle" class="b" font-size="11">"Reservar"</text>
    <text x="176" y="800" font-size="16" fill="#94a3b8">➜</text>

    <rect x="198" y="775" width="150" height="44" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="273" y="794" text-anchor="middle" class="b" font-size="11">modal: elige</text>
    <text x="273" y="809" text-anchor="middle" class="b" font-size="11">horario</text>
    <text x="354" y="800" font-size="16" fill="#94a3b8">➜</text>

    <rect x="376" y="775" width="250" height="44" rx="8" fill="#fffaf0" stroke="#d4a72c"/>
    <text x="501" y="794" text-anchor="middle" class="b" font-size="11">validar: RUT, correo, fecha,</text>
    <text x="501" y="809" text-anchor="middle" class="b" font-size="11">1×día, horario libre</text>
    <text x="632" y="800" font-size="16" fill="#94a3b8">➜</text>

    <rect x="654" y="775" width="150" height="44" rx="8" fill="#f8ecef" stroke="#7a1128"/>
    <text x="729" y="794" text-anchor="middle" class="b" font-size="11">guardar en</text>
    <text x="729" y="809" text-anchor="middle" class="b" font-size="11">localStorage</text>
    <text x="810" y="800" font-size="16" fill="#94a3b8">➜</text>

    <rect x="832" y="775" width="150" height="44" rx="8" fill="#eafaf1" stroke="#1e8e5a"/>
    <text x="907" y="794" text-anchor="middle" class="b" font-size="11">aviso ✓ y</text>
    <text x="907" y="809" text-anchor="middle" class="b" font-size="11">redibuja</text>
  </g>

  <!-- nota lateral -->
  <rect x="1010" y="775" width="160" height="44" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1022" y="792" font-size="10.5" fill="#334155">Cancelar sigue el mismo</text>
  <text x="1022" y="806" font-size="10.5" fill="#334155">patrón: filtrar la reserva</text>
  <text x="1022" y="820" font-size="10.5" fill="#334155">y volver a guardar.</text>
</svg>
